services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      ConnectionStrings__Jobs: "Host=db;Database=jobs;Username=jobs;Password=jobs"
      ASPNETCORE_URLS: "http://+:8080"
    ports: ["8080:8080"]
volumes:
  pgdata:
